apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nodejs-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
      - name: nodejs-app
        image: anandhukdevops/nodejs:v1
        ports:
        - containerPort: 3000
